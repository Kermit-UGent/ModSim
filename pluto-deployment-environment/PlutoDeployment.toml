[Export]
baked_state = false
baked_notebookfile = false
# Binder is disabled: our notebooks activate `pluto-deployment-environment` by a
# relative path, which does not exist in a Binder session, so every Binder run
# fails with "Package ... not found in current path". Re-enable this together
# with a Binder image that ships the environment.
offer_binder = false
ignore_cache = [
    "index.jl",
]
create_index = false
exclude = [
    # these are in the repo but not used on the website
    "tools/*",
    "PlutoPages.jl",
]

[SliderServer]
port = 8080
host = "0.0.0.0"
exclude=[
    # these are in the repo but not used on the website
    "tools/*",
    "PlutoPages.jl",
    
    # notebooks not interactive

    # don't run homeworks
    "*/hw*.jl",
]
