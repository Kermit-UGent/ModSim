name: Export notebooks with PlutoStaticHTML

on:
  push:
    # branches: # disabled for testing
      # - main
    # tags: '*'
  pull_request:

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate packages
        run: julia -e 'using Pkg; Pkg.activate("./exercises/solved_notebooks"); Pkg.instantiate()'
      - name: Build and deploy
        run: julia --color=yes static-notebook-exports/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}